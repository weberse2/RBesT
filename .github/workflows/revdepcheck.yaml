# Reverse dependency checks for CRAN submission readiness.
# Manual-only: trigger from the Actions tab ("Run workflow") or via the gh CLI
# (see the `revdepcheck-ci` Makefile target). Mirrors the CRAN revdep step for
# the current R release on Linux. Checks out the pushed tip of the selected ref.
on:
  workflow_dispatch:

name: revdepcheck

permissions:
  contents: read

concurrency:
  group: revdepcheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  revdepcheck:
    if: github.repository_owner == 'Novartis'
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            r-lib/revdepcheck
          needs: check

      - name: Run reverse dependency checks
        run: |
          revdepcheck::revdep_check(
            num_workers = 2,
            timeout = as.difftime(60, units = "mins"),
            quiet = FALSE
          )
        shell: Rscript {0}

      - name: Upload revdep results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: revdep-results
          path: |
            revdep/*.md
            revdep/*.rds
          if-no-files-found: warn

      - name: Fail on new reverse dependency problems
        if: always()
        run: |
          if [ -s revdep/problems.md ]; then
            echo "::error::New reverse dependency problems detected."
            cat revdep/problems.md
            exit 1
          fi
          echo "No new reverse dependency problems."
        shell: bash
