# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

jobs:
  pkgdown:
    if: github.repository_owner == 'Novartis'
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, any::roxygen2, local::.
          needs: website

      - name: Generate vignette bibliography from canonical inst/REFERENCES.bib
        # CRAN requires the vignette BibTeX file inside the vignette source
        # directory. vignettes/REFERENCES.bib is a derived, git-ignored copy of
        # the canonical inst/REFERENCES.bib (normally produced by the Makefile);
        # regenerate it here since CI does not run make before building the site.
        run: |
          {
            printf '%s\n' \
              '% DO NOT EDIT -- this file is auto-generated from inst/REFERENCES.bib.' \
              '% Edit inst/REFERENCES.bib (the canonical bibliography) instead and run' \
              '% make to regenerate this vignette copy. Any manual changes here will be' \
              '% overwritten by the build.' \
              ''
            cat inst/REFERENCES.bib
          } > vignettes/REFERENCES.bib
        shell: bash

      - name: Render examples with full default sampling for the website
        # The shipped man-roxygen/example-start.R uses slim sampling so that
        # examples run fast under CRAN checks. That slim sampling also degrades
        # the plots/output rendered on the reference website. Swap in the
        # full-sampling variant and regenerate the Rd (rd roclet only, so
        # NAMESPACE/collate are left untouched) before building the site.
        run: |
          file.copy("man-roxygen/example-start-full.R", "man-roxygen/example-start.R", overwrite = TRUE)
          roxygen2::roxygenize(roclets = "rd")
        shell: Rscript {0}

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs
